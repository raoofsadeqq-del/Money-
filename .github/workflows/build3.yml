name: Build APK v3
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q FinanceApp.zip
      - name: Fix Java target
        run: |
          sed -i 's|buildFeatures { compose = true }|buildFeatures { compose = true }\n    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }\n    kotlinOptions { jvmTarget = "17" }|' FinanceApp/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: FinanceApp
        run: gradle assembleDebug --no-daemon
      - run: cp FinanceApp/app/build/outputs/apk/debug/app-debug.apk MyFinance.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MyFinance-APK
          path: MyFinance.apk
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MyFinance.apk
